<style>
:root{--green:#b8ff00;--black:#050505;--dark:#0b0b0b;--card:#101010;--border:#242424;--text:#fff;--muted:#999}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{background:var(--black);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}.nav{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:24px 5%;background:rgba(5,5,5,.94);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}.logo{font-size:22px;font-weight:900;letter-spacing:2px}.navbtn,.btn{display:inline-block;padding:15px 24px;background:var(--green);color:#050505;font-size:11px;font-weight:900;letter-spacing:1.5px}.hero{min-height:78vh;display:flex;align-items:center;padding:110px 0 90px;border-bottom:1px solid var(--border)}.label{color:var(--green);font-size:11px;font-weight:900;letter-spacing:3px;margin-bottom:22px}.hero h1,.section h2,.cta h2{font-size:clamp(48px,8vw,100px);line-height:.95;letter-spacing:-4px;max-width:1000px}.hero h1 span,.section h2 span,.cta h2 span{color:var(--green)}.lead{max-width:700px;margin:35px 0;color:var(--muted);font-size:19px}.price{margin:0 0 30px;color:#777;font-size:12px;font-weight:800;letter-spacing:2px}.price strong{color:var(--green);font-size:24px;margin-left:8px}.section{padding:110px 0;border-bottom:1px solid var(--border)}.dark{background:var(--dark)}.large{max-width:820px;margin-top:35px;color:#aaa;font-size:18px;line-height:1.9}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;margin-top:65px;background:var(--border);border:1px solid var(--border)}.card{padding:40px;background:var(--card)}.num{display:block;color:var(--green);font-size:12px;font-weight:900;letter-spacing:2px;margin-bottom:20px}.card h3{font-size:24px;margin-bottom:12px}.card p{color:#888;line-height:1.8}.cta{padding:120px 0}.cta p{max-width:650px;margin:30px 0;color:#999;font-size:18px}.footer{padding:30px 0;border-top:1px solid var(--border);color:#666;font-size:13px}.error{padding:140px 0}.error h1{font-size:64px}.error p{margin:20px 0;color:#999}@media(max-width:700px){.nav{padding:18px 20px}.navbtn{padding:12px 15px;font-size:10px}.hero{min-height:auto;padding:90px 0 75px}.hero h1,.section h2,.cta h2{font-size:clamp(44px,14vw,68px);letter-spacing:-2px}.lead{font-size:17px}.section{padding:80px 0}.grid{grid-template-columns:1fr}.card{padding:30px}.wrap{width:min(100% - 30px,1180px)}}
</style>
</head>
<body>
<nav class="nav"><a class="logo" href="/">DARKANACONDA</a><a class="navbtn" href="/project-calculator.html">START A PROJECT</a></nav>
<main id="app"></main>
<footer class="footer"><div class="wrap">DARKANACONDA — Web design &amp; development for Australian businesses.</div></footer>
<script>
const services={
'business-websites':{n:'01',name:'Business Websites',price:'$999 AUD',title:'A Website Built For Your Business.',desc:'Professional websites designed around your business, brand and customers.',overview:'A business website gives customers a clear place to understand what you do, trust your business and contact you.',cards:[['01','Professional Presentation','A clear, modern website that presents your business and services professionally.'],['02','Built Around Your Brand','Your colours, content, services and business information are organised into one consistent experience.'],['03','Mobile Responsive','The website adapts across phones, tablets and desktops.'],['04','Clear Calls To Action','Customers can quickly find the information and contact options they need.']]},
'landing-pages':{n:'02',name:'Landing Pages',price:'$499 AUD',title:'Turn Visitors Into Customers.',desc:'High-converting landing pages built around one clear goal, offer or campaign.',overview:'A focused landing page removes distractions and gives visitors a clear path toward an enquiry, booking, purchase or other action.',cards:[['01','Focused Structure','The page is built around one primary goal instead of a full website navigation system.'],['02','Strong Messaging','Your offer and key information are presented clearly and quickly.'],['03','Mobile Responsive','The page works across phones, tablets and desktops.'],['04','Conversion Focused','Calls to action are placed where visitors can easily find them.']]},
'website-redesign':{n:'03',name:'Website Redesign',price:'$699 AUD',title:'Give Your Website A Fresh Start.',desc:'Transform an outdated website into a modern, responsive and professional experience.',overview:'A redesign keeps the useful parts of an existing website while improving its structure, visual design, mobile experience and usability.',cards:[['01','Modern Visual Design','A cleaner interface with stronger spacing, typography and hierarchy.'],['02','Better User Experience','Navigation and page structure are improved so information is easier to find.'],['03','Mobile Responsive','The redesigned website adapts across screen sizes.'],['04','Content Structure','Important information is organised around what customers need to know.']]},
'mobile-responsive-design':{n:'04',name:'Mobile Responsive Design',price:'$299 AUD',title:'A Website That Works Everywhere.',desc:'Your customers use phones, tablets, laptops and desktops. Your website should look professional and work properly on all of them.',overview:'Responsive design automatically adjusts layouts, text, images, buttons and navigation for the device someone is using. The experience should feel natural on every screen.',cards:[['01','Better First Impression','A website that looks broken on mobile can make a business look unprofessional.'],['02','Easier Navigation','Menus, buttons and sections are arranged for smaller screens.'],['03','More Enquiries','Clear mobile layouts make it easier for visitors to call, message or enquire.'],['04','Better User Experience','Customers should not have to zoom, scroll sideways or struggle to find information.']]},
'basic-seo':{n:'05',name:'Basic SEO',price:'$199 AUD',title:'Help Customers Find You Online.',desc:'A basic SEO foundation designed to help search engines understand your website and make it easier for potential customers to discover your business.',overview:'Basic SEO covers the essential foundations of a website so search engines can understand its pages, content and business information.',cards:[['01','Search-Friendly Structure','Important page elements are organised so search engines can better understand your website.'],['02','Page Titles & Descriptions','Core pages receive useful titles and descriptions for search results.'],['03','Technical Foundations','We check key technical details that affect discoverability and indexing.'],['04','Search Console Ready','The site is prepared for Google Search Console and ongoing search monitoring.']]},
'website-maintenance':{n:'06',name:'Website Maintenance',price:'$99 AUD / month',title:'Keep Your Website Running Properly.',desc:'Ongoing website updates, maintenance and checks after launch.',overview:'Website maintenance keeps your website content, links, basic functionality and technical setup in good working order after launch.',cards:[['01','Content Updates','Text, images and basic website content can be updated when required.'],['02','Technical Checks','We check important links, pages and common website issues.'],['03','Security & Updates','Where applicable, routine platform and dependency updates are handled.'],['04','Ongoing Support','You have a place to send website changes and maintenance requests.']]},
'custom-solutions':{n:'07',name:'Custom Solutions',price:'Let’s Talk',title:'Build What Your Business Actually Needs.',desc:'Tailored functionality, integrations and advanced requirements beyond a standard website.',overview:'Custom projects are planned around the specific functionality your business needs rather than a fixed package.',cards:[['01','Custom Functionality','Features can be planned around your exact business requirements.'],['02','Integrations','Connect your website with suitable external services and business tools.'],['03','Advanced Requirements','Complex workflows and specialised website features can be scoped separately.'],['04','Project Planning','Requirements, scope and pricing are confirmed before development begins.']]}
};
function keyFromPath(){let p=location.pathname.toLowerCase();let m=p.match(/services\/([^/]+?)(?:\.html)?\/?$/);if(m&&services[m[1]])return m[1];let q=new URLSearchParams(location.search).get('service');return services[q]?q:'business-websites'}
const key=keyFromPath(),s=services[key];
document.title=s.name+' | DARKANACONDA';document.getElementById('page-title').textContent=s.name+' | DARKANACONDA';document.getElementById('page-description').content=s.desc;document.getElementById('canonical').href='https://darkanaconda.com/services/'+key+'.html';
document.getElementById('app').innerHTML=`<header class="hero"><div class="wrap"><p class="label">SERVICE ${s.n}</p><h1>${s.title.replace(/\.$/,'')}<span>.</span></h1><p class="lead">${s.desc}</p><div class="price">FROM <strong>${s.price}</strong></div><a class="btn" href="/project-calculator.html?service=${key}">GET AN ESTIMATE</a></div></header><section class="section"><div class="wrap"><p class="label">OVERVIEW</p><h2>${s.name}<br><span>built around your needs.</span></h2><p class="large">${s.overview}</p></div></section><section class="section dark"><div class="wrap"><p class="label">WHAT'S INCLUDED</p><h2>A clear scope.<br><span>A better result.</span></h2><div class="grid">${s.cards.map(c=>`<article class="card"><span class="num">${c[0]}</span><h3>${c[1]}</h3><p>${c[2]}</p></article>`).join('')}</div></div></section><section class="cta"><div class="wrap"><p class="label">START YOUR PROJECT</p><h2>Ready to get<br><span>started?</span></h2><p>Tell us what you need and we can review the project requirements and confirm the final scope and price.</p><a class="btn" href="/project-calculator.html?service=${key}">GET AN ESTIMATE</a></div></section>`;
</script>
</body>
</html>
